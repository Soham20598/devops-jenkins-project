<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DevOps CI/CD Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; color: #172033; }
    .box { max-width: 800px; margin: 90px auto; padding: 45px; background: white; border-radius: 18px; box-shadow: 0 10px 35px #0002; text-align: center; }
    .tag { display:inline-block; padding:8px 14px; border-radius:20px; background:#e8f1ff; }
    h1 { font-size: 42px; margin: 20px 0 10px; }
    p { font-size: 19px; color:#536174; }
  </style>
</head>
<body>
  <div class="box">
    <span class="tag">Jenkins + Docker + GitHub</span>
    <h1>DevOps CI/CD Demo 🚀</h1>
    <p>Application successfully deployed through an automated pipeline.</p>
    <p><strong>Application Version: {{ version }}</strong></p>
  </div>
</body>
</html>
